name: datum-connect
depends:
  - service: cri
  - network:
    - addresses
    - connectivity
    - etcfiles
    - hostname
  - time: true
  - configuration: true
container:
  entrypoint: /usr/local/bin/datum-connect-service
  environment:
    - PATH=/usr/local/bin
    - HOME=/var/lib/datum-connect
    - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    - RUST_LOG=info
  security:
    writeableRootfs: false
  mounts:
    # datumctl session store, iroh endpoint key and tunnel state.
    - source: /var/lib/datum-connect
      destination: /var/lib/datum-connect
      type: bind
      options:
        - bind
        - rw
    - source: /etc/ssl/certs
      destination: /etc/ssl/certs
      type: bind
      options:
        - rbind
        - ro
restart: always
